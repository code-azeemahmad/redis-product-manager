# ==============================================================================
# Redis 8 Configuration — Disposable Cache & Best-Effort Limiter
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Network & General Configuration
# ------------------------------------------------------------------------------
# Bind to all container network interfaces (kept private via Docker Compose network)
bind 0.0.0.0
port 6379

# Run in foreground for Docker container lifecycle
daemonize no

# Protected mode enabled
protected-mode yes

# TCP listen backlog
tcp-backlog 511

# Connection idle timeout (0 = disabled / keep alive)
timeout 0
tcp-keepalive 300

# Logging level
loglevel notice

# ------------------------------------------------------------------------------
# 2. Access Control List (ACL)
# ------------------------------------------------------------------------------
# Load users and permissions from external ACL file
aclfile /usr/local/etc/redis/users.acl

# ------------------------------------------------------------------------------
# 3. Memory Management & Eviction
# ------------------------------------------------------------------------------
# Hard memory limit (must stay below container mem_limit of 384m)
maxmemory 256mb

# Eviction policy: evict keys with TTL set using LRU algorithm.
# Cache entries have finite TTLs (300s/120s) and rate-limit keys expire.
maxmemory-policy volatile-lru
maxmemory-samples 5

# Asynchronous non-blocking memory reclamation
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# ------------------------------------------------------------------------------
# 4. Persistence (Disposable Cache)
# ------------------------------------------------------------------------------
# Disable RDB snapshots — Redis is used purely as disposable cache & counters
save ""

# Disable AOF persistence
appendonly no
